<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday My Love ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #ffe6eb;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
      overflow: hidden;
    }
    .card {
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 350px;
      width: 100%;
      position: relative;
    }
    h1 {
      color: #ff4d6d;
      font-size: 1.8rem;
      margin-bottom: 15px;
    }
    p {
      color: #555;
      font-size: 1.1rem;
      margin-bottom: 25px;
      line-height: 1.5;
    }
    .gif-container img {
      width: 150px;
      border-radius: 15px;
      margin-bottom: 20px;
    }
    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      position: relative;
      min-height: 60px;
    }
    button {
      padding: 12px 25px;
      font-size: 1.1rem;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease;
    }
    .btn-yes {
      background-color: #ff4d6d;
      color: white;
      z-index: 2;
    }
    .btn-no {
      background-color: #cccccc;
      color: #333;
      position: absolute;
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <div class="gif-container">
      <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExazh2eml6dXZyYnh0Zmxnd29xd2tzZndwZWdvanVjc2JvM3Y4Nmc1YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/LpDmM2w9a451d3M336/giphy.gif" alt="Cute Bear">
    </div>
    
    <h1 id="question">عيد ميلاد سعيد يا أحسن حاجة وقعات ليا! ❤️</h1>
    <p id="message">عندي ليك سؤال مهم... واش كاتبغيني قد ما كاتبغيك؟ 🥺</p>

    <div class="btn-container">
      <button class="btn-yes" id="yesBtn" onclick="acceptLove()">أه كاتبغيك بزاف! 🥰</button>
      <button class="btn-no" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">لا 😜</button>
    </div>
  </div>

  <script>
    let yesScale = 1;

    function moveButton() {
      const noBtn = document.getElementById('noBtn');
      const yesBtn = document.getElementById('yesBtn');

      // تكبير زر "أه" فكل مرة يحاول يضغط على "لا"
      yesScale += 0.3;
      yesBtn.style.transform = `scale(${yesScale})`;

      // تحريك زر "لا" لمكان عشوائي
      const x = Math.random() * (window.innerWidth - 100) - (window.innerWidth / 2 - 50);
      const y = Math.random() * (window.innerHeight - 100) - (window.innerHeight / 2 - 50);

      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    }

    function acceptLove() {
      const card = document.getElementById('card');
      card.innerHTML = `
        <div class="gif-container">
          <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbTZ6a241Zm51eDRiYmd6cXJ0ZnU2Zzh5eW5xNnU1a3Z6Yzh1NW5rciZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/KZXp433M6CagM/giphy.gif" alt="Happy">
        </div>
        <h1 style="color: #ff4d6d;">عارفها! 🥳❤️</h1>
        <p style="margin-top: 15px;">كل عام وأنت بألف خير يا أحلى إنسان فحياتي. الله يخليك ليا ودائماً مع بعضياتنا وإن شاء الله العيد الجاي نكونو قراب! 🎂✨</p>
      `;
    }
  </script>

</body>
</html>
